<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="cardTitle cardDesc">
  <title id="cardTitle">DriverLens — Desktop (ARM64)</title>
  <desc id="cardDesc">DriverLens desktop edition card. A read-only Windows device and driver inventory; Tauri 2 + React + Rust native ARM64 desktop app. In development; PowerShell 7 and WebView2 required; local only, no network, no telemetry. github.com/Fredy-E/DriverLens</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080e19"/>
      <stop offset="1" stop-color="#101a2b"/>
    </linearGradient>
  </defs>

  <!-- background + top accent bar -->
  <rect x="0" y="0" width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="12" fill="#266deb"/>
  <rect x="0" y="12" width="1280" height="3" fill="#72adff" opacity="0.55"/>

  <!-- text block -->
  <text x="96" y="234" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="50" font-weight="700" letter-spacing="-0.5" fill="#ffffff">DriverLens — Desktop (ARM64)</text>
  <rect x="96" y="262" width="190" height="6" rx="3" fill="#266deb"/>

  <text x="96" y="326" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="28" fill="#dce6f8">A read-only Windows device and driver inventory.</text>
  <text x="96" y="366" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="28" fill="#dce6f8">Tauri 2 + React + Rust — native ARM64 desktop app.</text>

  <text x="96" y="408" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="22" fill="#95a8c8">In development · PowerShell 7 + WebView2 required</text>
  <text x="96" y="440" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="22" fill="#95a8c8">Local only — no network, no telemetry.</text>

  <text x="96" y="560" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="22" fill="#72adff">github.com/Fredy-E/DriverLens</text>

  <!-- right motif: desktop app window with the DriverLens lens -->
  <g>
    <rect x="874" y="165" width="380" height="270" rx="18" fill="#101a2b" stroke="#263957" stroke-width="2"/>
    <circle cx="906" cy="192" r="5" fill="#263957"/>
    <circle cx="928" cy="192" r="5" fill="#263957"/>
    <circle cx="950" cy="192" r="5" fill="#263957"/>
    <line x1="898" y1="212" x2="1230" y2="212" stroke="#263957" stroke-width="2"/>

    <g stroke="#72adff" stroke-linecap="round">
      <line x1="1146" y1="322" x2="1164" y2="322" stroke-width="3" opacity="0.55"/>
      <line x1="1122" y1="380" x2="1134.7" y2="392.7" stroke-width="3" opacity="0.55"/>
      <line x1="1064" y1="404" x2="1064" y2="422" stroke-width="3" opacity="0.55"/>
      <line x1="1006" y1="380" x2="993.3" y2="392.7" stroke-width="3" opacity="0.55"/>
      <line x1="982" y1="322" x2="964" y2="322" stroke-width="3" opacity="0.55"/>
      <line x1="1006" y1="264" x2="993.3" y2="251.3" stroke-width="3" opacity="0.55"/>
      <line x1="1064" y1="240" x2="1064" y2="222" stroke-width="3" opacity="0.55"/>
      <line x1="1122" y1="264" x2="1134.7" y2="251.3" stroke-width="3" opacity="0.55"/>
    </g>
    <circle cx="1064" cy="322" r="94" fill="none" stroke="#72adff" stroke-width="3" opacity="0.95"/>
    <circle cx="1064" cy="322" r="64" fill="none" stroke="#72adff" stroke-width="2.5" opacity="0.55"/>
    <circle cx="1064" cy="322" r="36" fill="none" stroke="#72adff" stroke-width="2" opacity="0.35"/>
    <circle cx="1064" cy="322" r="11" fill="#72adff" opacity="0.9"/>
  </g>
</svg>
